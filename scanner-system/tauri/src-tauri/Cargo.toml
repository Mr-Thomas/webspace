[package]
name = "scanner-client"
version = "2.0.0"
description = "Scanner Desktop Client"
authors = ["wangwj"]
edition = "2021"

[lib]
name = "scanner_client_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
