<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Scanner WS 专业客户端 | 扫描管理平台</title>
    <script src="stomp.umd.min.js"></script>
    <style>
        :root {
            --primary: #1677ff;
            --primary-dark: #0958d9;
            --primary-bg: #e6f4ff;
            --success: #52c41a;
            --warning: #faad14;
            --error: #ff4d4f;
            --danger: #ff4d4f;
            --text: #1f2f3d;
            --text-secondary: #5a6874;
            --border: #e4e7ed;
            --bg-page: #f5f7fa;
            --card-bg: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 8px 20px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
            background: var(--bg-page);
            color: var(--text);
            font-size: 14px;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* WebView2 兼容性：统一表单元素高度和字体 */
        input, select, button, textarea {
            font-family: inherit;
            font-size: inherit;
            line-height: 1.4;
        }

        input:not([type=checkbox]):not([type=radio]) {
            min-height: 32px;
        }

        button {
            height: 36px;
        }

        select {
            min-height: 32px;
        }

        /* WebView2 兼容性：flex gap 替代方案（用 margin 代替 gap 避免旧版 WebView2 gap 渲染差异） */
        .flex-row {
            display: flex;
            flex-wrap: nowrap;
        }
        .flex-row > * + * {
            margin-left: 12px;
        }

        .flex-row-gap24 {
            display: flex;
            flex-wrap: nowrap;
        }
        .flex-row-gap24 > * + * {
            margin-left: 24px;
        }

        .flex-center {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px 28px;
        }

        /* 顶部连接栏 */
        .connection-bar {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .connection-bar > * {
            margin: 2px 0;
        }
        .connection-bar > * + * {
            margin-left: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            margin-right: 8px;
        }
        .logo-area > * + * {
            margin-left: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), #69b1ff);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .logo-text {
            font-weight: 700;
            font-size: 18px;
            background: linear-gradient(135deg, #1f2f3d, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #f8f9fc;
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 4px 16px;
            transition: all 0.2s;
        }

        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }

        .input-group input {
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 13px;
            width: 200px;
            outline: none;
        }

        .input-group span {
            color: #8c9aab;
            margin-right: 6px;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f0f2f5;
            color: var(--text);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(22, 119, 255, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #fff0f0;
            color: var(--danger);
            border: 1px solid #ffccc7;
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
        }
        .status-badge > * + * {
            margin-left: 8px;
        }
            border-radius: 40px;
            background: #f8f9fc;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d9d9d9;
        }

        .status-dot.on {
            background: var(--success);
            box-shadow: 0 0 0 2px rgba(82, 196, 26, 0.2);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* 主布局 两栏 */
        .main-grid {
            display: grid;
            grid-template-columns: 480px 1fr;
            gap: 24px;
        }

        @media (max-width: 1100px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 16px;
            }
        }

        /* 左侧卡片通用 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            border: 1px solid rgba(0, 0, 0, 0.02);
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.01);
        }

        .card-header h3 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        .card-header h3 > * + * {
            margin-left: 8px;
        }

        .card-body {
            padding: 20px;
        }

        /* 表单现代风格 */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px 28px;
        }

        .full-width {
            grid-column: span 2;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .field-group label {
            font-size: 14px;
            font-weight: 700;
            color: #3a4b62;
            margin-bottom: 6px;
        }

        .field-group input,
        .field-group select {
            background: #ffffff;
            border: 1px solid #dee4ec;
            border-radius: 14px;
            padding: 6px 14px;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .field-group input:focus,
        .field-group select:focus,
        .field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.1);
        }

        .field {
            background: #ffffff;
            border: 1px solid #dee4ec;
            border-radius: 14px;
            padding: 10px 14px;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        /* 开关 */
        .toggle-switch {
            display: flex;
            align-items: center;
            background: #f8fafd;
            padding: 6px 0;
            border-radius: 40px;
        }

        .toggle-switch .toggle-label {
            margin-right: 14px;
        }

        .switch-ui {
            width: 44px;
            height: 24px;
            background: #cbd5e1;
            border-radius: 40px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }

        .switch-ui.active {
            background: var(--primary);
        }

        .switch-ui::after {
            content: "";
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: 0.2s;
        }

        .switch-ui.active::after {
            left: 21px;
        }

        .checkbox-cluster {
            display: flex;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .checkbox-cluster .checkbox-item + .checkbox-item {
            margin-left: 18px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            background: #ffffff;
        }
        .checkbox-item input {
            margin-right: 8px;
        }
            padding: 6px 14px 6px 10px;
            border-radius: 40px;
            border: 1px solid #e2e8f2;
            cursor: pointer;
        }

        .checkbox-item:hover {
            border-color: var(--primary);
            background: #f6f9ff;
        }

        .checkbox-item input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            margin: 0;
        }

        /* 右侧日志 & 图片 */
        .right-panel {
            min-width: 0;
        }

        .log-container {
            background: #1e1f2c;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .log-header-bar {
            background: #2a2b3a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .log-header-bar span {
            color: #b9c7d9;
            font-weight: 500;
            font-size: 13px;
        }

        .log-header-bar .toggle-icon {
            font-size: 18px;
            transition: transform 0.2s;
        }

        .log-header-bar .log-actions {
            display: flex;
            align-items: center;
        }
        .log-header-bar .log-actions > * + * {
            margin-left: 8px;
        }

        .log-clear-btn {
            background: none;
            border: 1px solid #4a5a7a;
            height: auto;
            color: #8aa0c0;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.6;
        }

        .log-clear-btn:hover {
            background: #e74c3c;
            border-color: #e74c3c;
            color: #fff;
        }

        .log-content {
            height: 340px;
            overflow-y: auto;
            font-family: 'SF Mono', monospace;
            font-size: 12px;
            padding: 12px;
            background: #0f1117;
            color: #e2e8f0;
            transition: all 0.2s;
        }

        .log-content.collapsed {
            display: none;
        }

        .log-entry {
            padding: 6px 10px;
            border-bottom: 1px solid #1e2432;
            display: flex;
        }
        .log-entry > * + * {
            margin-left: 12px;
        }

        .log-time {
            color: #5f7f9e;
            flex-shrink: 0;
        }

        .log-recv .log-text {
            color: #6fcf97;
        }

        .log-send .log-text {
            color: #f2c94c;
        }

        .log-info .log-text {
            color: #5dade2;
        }

        .log-err .log-text {
            color: #e74c3c;
        }

        .log-warn .log-text {
            color: #f39c12;
        }

        .log-text {
            word-break: break-all;
        }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
            padding: 8px 4px;
        }

        .image-gallery.collapsed {
            display: none;
        }

        .gallery-card-body {
            transition: all 0.2s;
        }

        .gallery-toggle-icon {
            font-size: 14px;
            transition: transform 0.2s;
            margin-left: 8px;
        }

        .gallery-item {
            background: #faf9fe;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #edeff5;
            position: relative;
            transition: transform 0.15s;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 1 / 1.4;
            object-fit: cover;
            display: block;
        }

        .page-badge {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            position: absolute;
            top: 6px;
            left: 6px;
        }

        /* 大图预览 Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 92%;
            max-height: 92%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            cursor: default;
        }

        .lightbox-close {
            position: fixed;
            top: 20px;
            right: 28px;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.2s;
            z-index: 1001;
            user-select: none;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.2s;
            z-index: 1001;
            user-select: none;
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }

        .format-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            font-size: 12px;
            color: #fa8c16;
            background: #fff7e6;
            border-radius: 50%;
            margin-left: 4px;
            cursor: help;
            vertical-align: middle;
            transition: background 0.2s;
        }

        .format-badge:hover {
            background: #ffe7ba;
        }

        .action-bar {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #ecf3fa;
            padding-top: 20px;
        }
        .action-bar > * + * {
            margin-left: 12px;
        }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- 顶部栏 -->
        <div class="connection-bar">
            <div class="logo-area">
                <div class="logo-icon">📠</div>
                <div class="logo-text">Scanner WS</div>
            </div>
            <div class="input-group"><span>🌐</span><input type="text" id="serverUrl" value="localhost:8899"
                    placeholder="服务器地址:端口"></div>
            <div class="input-group"><span>🔑</span><input type="text" id="token" placeholder="JWT Token (可选)"></div>
            <button class="btn btn-primary" id="btnConnect">🔌 连接</button>
            <button class="btn btn-danger" id="btnDisconnect" disabled>⛔ 断开</button>
            <div class="status-badge"><span class="status-dot" id="statusDot"></span><span id="connStatus">未连接</span>
            </div>
        </div>

        <div class="main-grid">
            <!-- 左侧：参数面板 -->
            <div class="left-panel">
                <!-- 扫描仪卡片 -->
                <div class="card">
                    <div class="card-header">
                        <h3>🖨️ 扫描仪设备</h3>
                        <div>
                            <button class="btn btn-sm" id="btnScannerStatus" style="padding:4px 12px;">刷新状态</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="scannerDisplay" class="scanner-list" style="min-height:80px;">— 点击刷新 —</div>
                    </div>
                </div>

                <!-- 新建扫描任务 - 规整模块 -->
                <div class="card">
                    <div class="card-header">
                        <h3>✨ 新建扫描任务</h3>
                    </div>
                    <div class="card-body">
                        <div class="form-grid">
                            <div class="field-group full-width"><label>🏷️ Task ID</label><input type="text"
                                    id="fTaskId" value="task_">
                            </div>
                            <div class="field-group full-width"><label>🖨️ 选择扫描仪</label><select id="fScanner">
                                    <option value="">默认（自动选择）</option>
                                </select></div>
                        </div>
                        <div class="flex-row-gap24" style="margin: 16px 0 12px 0;">
                            <div class="field-group" style="flex:1; min-width:0;"><label><span>📐</span> DPI 分辨率</label><input
                                    type="number" id="fDpi" value="200"></div>
                            <div class="field-group" style="flex:1; min-width:0;"><label><span>🎨</span> 色彩模式</label><select
                                    id="fColor">
                                    <option value="bw" selected>⚫ 黑白</option>
                                    <option value="gray">🌓 灰度</option>
                                    <option value="rgb">🌈 彩色</option>
                                </select></div>
                            <div class="field-group" style="flex:1; min-width:0;"><label>📄 输出格式<span id="formatBadge"
                                        class="format-badge" title="BUFFERED 模式下仅支持 JPEG 输出"
                                        style="display:none;">ⓘ</span></label><select id="fFormat">
                                    <option value="jpeg" selected>JPEG</option>
                                    <option value="png">PNG</option>
                                    <option value="pdf">PDF</option>
                                    <option value="tiff">TIFF</option>
                                </select></div>
                        </div>
                        <div class="flex-row-gap24" style="margin: 16px 0 12px 0;">
                            <div class="toggle-switch"><span class="toggle-label" id="duplexLabel">单面模式</span>
                                <div class="switch-ui" id="duplexSwitch"></div>
                                <input type="checkbox" id="fDuplex" style="display:none;">
                            </div>
                            <div class="toggle-switch"><span class="toggle-label" id="doubleFeedLabel">双张检测关</span>
                                <div class="switch-ui" id="doubleFeedSwitch"></div>
                                <input type="checkbox" id="fDoubleFeed" style="display:none;">
                            </div>
                        </div>
                        <div style="margin-top:12px;">
                            <label style="font-size:14px; font-weight:700; color:#3a4b62; display:block; margin-bottom:8px;">✨ 图像增强</label>
                            <div style="display:flex;">
                                <label class="checkbox-item" style="flex:1; justify-content:center; background:#f8fafd; border-radius:40px; padding:3px 14px; margin-right:10px;"><input type="checkbox" id="fDeskew">
                                    <span>纠偏</span></label>
                                <label class="checkbox-item" style="flex:1; justify-content:center; background:#f8fafd; border-radius:40px; padding:3px 14px; margin-right:10px;"><input type="checkbox" id="fBorder">
                                    <span>裁边</span></label>
                                <label class="checkbox-item" style="flex:1; justify-content:center; background:#f8fafd; border-radius:40px; padding:3px 14px; margin-right:10px;"><input type="checkbox" id="fRotate">
                                    <span>旋转校正</span></label>
                                <label class="checkbox-item" style="flex:1; justify-content:center; background:#f8fafd; border-radius:40px; padding:3px 14px;"><input type="checkbox" id="fBlank">
                                    <span>去空白页</span></label>
                            </div>
                        </div>
                        <button class="btn btn-primary" id="btnStartScan" style="width:100%; margin-top: 20px;">▶
                            启动扫描任务
                        </button>
                    </div>
                </div>

                <!-- 任务操作卡片 -->
                <div class="card">
                    <div class="card-header">
                        <h3>🎮 任务管理中心</h3>
                    </div>
                    <div class="card-body">
                        <div style="display: flex; margin-bottom: 16px;"><input type="text" id="fOpTaskId"
                                placeholder="任务 ID" class="field" style="flex:1; margin-right:12px;">
                        </div>
                        <div style="display: flex; flex-wrap:wrap;">
                            <button class="btn btn-sm" id="btnTaskStatus" style="margin-right:10px; margin-bottom:4px;">📋 查询状态</button>
                            <button class="btn btn-sm" id="btnTaskStop" style="margin-right:10px; margin-bottom:4px;">⏹️ 停止扫描</button>
                            <button class="btn btn-sm" id="btnTaskList" style="margin-right:10px; margin-bottom:4px;">📑 任务列表</button>
                            <button class="btn btn-sm" id="btnHealth" style="margin-right:10px; margin-bottom:4px;">❤️ 健康检查</button>
                            <button class="btn btn-sm" id="btnHistory"
                                style="background:#f0f5ff;color:#1677ff;border:1px solid #adc6ff;">📁 历史文件
                            </button>
                        </div>
                        <div id="taskStatusBanner"
                            style="display:none; margin-top:12px; padding:10px 14px; border-radius:10px; font-size:13px;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧区域：日志 + 图片 -->
            <div class="right-panel">
                <!-- 可收起日志 -->
                <div class="log-container">
                    <div class="log-header-bar" id="logHeader">
                        <span>📡 实时消息日志 (STOMP)</span>
                        <div class="log-actions">
                            <button class="log-clear-btn" id="logClearBtn">清空</button>
                            <span class="toggle-icon" id="logToggleIcon">▼</span>
                        </div>
                    </div>
                    <div id="logBox" class="log-content collapsed"></div>
                </div>
                <!-- 图片画廊（可折叠） -->
                <div class="card">
                    <div class="card-header" id="galleryHeader" style="cursor:pointer;user-select:none;">
                        <h3>🖼️ 扫描图像预览</h3>
                        <div style="display:flex;align-items:center;">
                            <span id="pageCount" style="font-size:12px;">0 张</span>
                            <span class="gallery-toggle-icon" id="galleryToggleIcon" style="margin-left:8px;">▼</span>
                        </div>
                    </div>
                    <div id="galleryBody" class="card-body gallery-card-body" style="padding-top: 8px;">
                        <div id="imageArea" class="image-gallery">
                            <div style="color:#aaa; text-align:center; grid-column:1/-1;">暂无图片</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 大图预览 Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">✕</span>
        <span class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</span>
        <img id="lightboxImg" src="" alt="预览大图">
        <span class="lightbox-nav lightbox-next" id="lightboxNext">›</span>
        <div id="lightboxCounter"
            style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:#fff;font-size:15px;font-weight:500;background:rgba(0,0,0,0.5);padding:6px 18px;border-radius:20px;z-index:1001;user-select:none;letter-spacing:1px;">
        </div>
    </div>

    <!-- 历史文件浏览模态框 -->
    <div class="lightbox" id="historyModal" style="z-index:900;">
        <span class="lightbox-close" id="historyModalClose">✕</span>
        <div
            style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:680px; max-width:92%; max-height:86%; background:#fff; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; cursor:default;">
            <div
                style="padding:18px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0;">
                <h3 style="font-size:17px; display:flex; align-items:center;" id="historyModalTitle">📁
                    历史文件</h3>
                <div style="display:flex;">
                    <button class="btn btn-sm" id="historyBackBtn" style="display:none; padding:4px 12px;">← 返回</button>
                    <button class="btn btn-sm" id="historyRefreshBtn" style="padding:4px 12px; margin-left:8px;">🔄 刷新</button>
                </div>
            </div>
            <div id="historyContent"
                style="flex:1; overflow-y:auto; padding:16px 20px; min-height:200px; max-height:480px;">
                <div style="color:#999; text-align:center; padding:40px 0;">加载中...</div>
            </div>
            <div
                style="padding:12px 24px; border-top:1px solid var(--border); font-size:12px; color:#999; text-align:center; flex-shrink:0;">
                点击文件可预览大图
            </div>
        </div>
    </div>

    <script>
        // ---------- 核心逻辑 (与原功能一致) ----------
        let stomp = null;
        let connected = false;
        let acquireMode = 'FILE';
        const taskSubscriptions = {};
        const $ = id => document.getElementById(id);
        const logBox = $('logBox');
        const imageArea = $('imageArea');
        const pageCountSpan = $('pageCount');
        const progressSpan = document.createElement('span');
        progressSpan.id = 'progressPercent';
        progressSpan.style.cssText = 'font-size:12px;color:#52c41a;margin-left:8px;display:none;';
        pageCountSpan.parentNode.appendChild(progressSpan);

        // 日志折叠（默认收起）
        let logCollapsed = true;
        const logHeader = document.getElementById('logHeader');
        const logToggleIcon = document.getElementById('logToggleIcon');
        logHeader.addEventListener('click', (e) => {
            if (e.target.closest('.log-clear-btn')) return; // 清空按钮不触发展开/折叠
            logCollapsed = !logCollapsed;
            if (logCollapsed) {
                logBox.classList.add('collapsed');
                logToggleIcon.innerText = '▼';
            } else {
                logBox.classList.remove('collapsed');
                logToggleIcon.innerText = '▲';
            }
        });

        // 清空日志
        document.getElementById('logClearBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            logBox.innerHTML = '';
        });

        // 画廊折叠
        let galleryCollapsed = true; // 初始收起
        const galleryHeader = document.getElementById('galleryHeader');
        const galleryBody = document.getElementById('galleryBody');
        const galleryToggleIcon = document.getElementById('galleryToggleIcon');
        const imageAreaEl = document.getElementById('imageArea');

        function galleryExpand() {
            galleryCollapsed = false;
            imageAreaEl.classList.remove('collapsed');
            galleryToggleIcon.innerText = '▲';
        }

        function galleryCollapse() {
            galleryCollapsed = true;
            imageAreaEl.classList.add('collapsed');
            galleryToggleIcon.innerText = '▼';
        }

        galleryHeader.addEventListener('click', (e) => {
            if (e.target.closest('.gallery-toggle-icon') || e.target.closest('#pageCount') || e.target.closest('#progressPercent') || e.target === galleryHeader || e.target.tagName === 'H3') {
                if (galleryCollapsed) {
                    galleryExpand();
                } else {
                    galleryCollapse();
                }
            }
        });
        // 初始状态：收起
        galleryCollapse();

        function log(type, msg) {
            if (logBox.classList.contains('collapsed') && type !== 'err') {
            } // 依然记录但只显示已存，但为了用户体验，即使折叠依然追加内容，但滚动不干涉
            const now = new Date();
            const timeStr = `${now.toLocaleTimeString('zh-CN', { hour12: false })}.${String(now.getMilliseconds()).padStart(3, '0')}`;
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerHTML = `<span class="log-time">[${timeStr}]</span><span class="log-text">${escapeHtml(msg)}</span>`;
            logBox.appendChild(entry);
            if (!logCollapsed) logBox.scrollTop = logBox.scrollHeight;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function (m) {
                return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;';
            });
        }

        function setConnectedState(state) {
            connected = state;
            $('btnConnect').disabled = state;
            $('btnDisconnect').disabled = !state;
            const statusSpan = $('connStatus');
            const dot = $('statusDot');
            statusSpan.innerText = state ? '已连接' : '未连接';
            dot.className = `status-dot ${state ? 'on' : ''}`;
        }

        const galleryItems = []; // { key, taskId, page, imgUrl }
        function addImage(taskId, page, imgUrl) {
            const key = `${taskId}-${page}`;
            if (document.querySelector(`.gallery-item[data-key="${key}"]`)) return;
            // 自动展开画廊
            if (galleryCollapsed) galleryExpand();
            // 移除占位文字（首次添加图片时）
            const placeholder = imageArea.querySelector('div:first-child');
            if (placeholder && !placeholder.classList.contains('gallery-item')) {
                placeholder.remove();
            }
            galleryItems.push({ key, taskId, page, imgUrl });
            const idx = galleryItems.length - 1;
            const div = document.createElement('div');
            div.className = 'gallery-item';
            div.setAttribute('data-key', key);
            div.innerHTML = `<div class="page-badge">📄 #${page}</div><img src="${imgUrl}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%22%20height%3D%22100%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23f0f0f0%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%20dy%3D%22.3em%22%20fill%3D%22%23999%22%3E加载失败%3C%2Ftext%3E%3C%2Fsvg%3E';">`;
            div.addEventListener('click', () => openLightbox(idx));
            imageArea.appendChild(div);
            const total = document.querySelectorAll('.gallery-item').length;
            pageCountSpan.innerText = `${total} 张`;
        }

        /* ---- Lightbox 大图预览 ---- */
        const lightbox = $('lightbox');
        const lightboxImg = $('lightboxImg');
        const lightboxClose = $('lightboxClose');
        const lightboxPrev = $('lightboxPrev');
        const lightboxNext = $('lightboxNext');
        let lightboxIndex = -1;

        function openLightbox(idx) {
            if (idx < 0 || idx >= galleryItems.length) return;
            lightboxIndex = idx;
            lightboxImg.src = galleryItems[idx].imgUrl;
            lightboxImg.alt = `#${galleryItems[idx].page}`;
            lightbox.classList.add('active');
            updateLightboxNav();
            $('lightboxCounter').innerText = `${idx + 1} / ${galleryItems.length}`;
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            lightboxImg.src = '';
        }

        function updateLightboxNav() {
            lightboxPrev.style.display = galleryItems.length > 1 ? '' : 'none';
            lightboxNext.style.display = galleryItems.length > 1 ? '' : 'none';
        }

        function lightboxPrevImage() {
            if (galleryItems.length <= 1) return;
            const prev = lightboxIndex <= 0 ? galleryItems.length - 1 : lightboxIndex - 1;
            openLightbox(prev);
        }

        function lightboxNextImage() {
            if (galleryItems.length <= 1) return;
            const next = lightboxIndex >= galleryItems.length - 1 ? 0 : lightboxIndex + 1;
            openLightbox(next);
        }

        // 点击遮罩关闭
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        lightboxClose.addEventListener('click', closeLightbox);
        lightboxPrev.addEventListener('click', (e) => {
            e.stopPropagation();
            lightboxPrevImage();
        });
        lightboxNext.addEventListener('click', (e) => {
            e.stopPropagation();
            lightboxNextImage();
        });
        // 键盘导航
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') lightboxPrevImage();
            if (e.key === 'ArrowRight') lightboxNextImage();
        });

        function getImageUrl(taskId, page) {
            const host = $('serverUrl').value.trim() || 'localhost:8899';
            return `http://${host}/api/scan/files/${encodeURIComponent(taskId)}/${page}`;
        }

        /* 显示任务状态横幅 */
        function showTaskBanner(status, message) {
            const banner = $('taskStatusBanner');
            banner.style.display = 'block';
            let bg, color, icon;
            switch (status) {
                case 'scan_done':
                case 'done':
                    bg = '#f6ffed';
                    color = '#389e0d';
                    icon = '✅';
                    break;
                case 'scanning':
                    bg = '#e6f7ff';
                    color = '#1890ff';
                    icon = '🔄';
                    break;
                case 'error':
                    bg = '#fff2f0';
                    color = '#cf1322';
                    icon = '❌';
                    break;
                case 'cancelled':
                    bg = '#fffbe6';
                    color = '#d48806';
                    icon = '⏹️';
                    break;
                default:
                    bg = '#f0f2f5';
                    color = '#595959';
                    icon = 'ℹ️';
            }
            banner.style.background = bg;
            banner.style.color = color;
            banner.style.border = `1px solid ${color}20`;
            banner.textContent = `${icon} ${message || status}`;
            // 非终态不自动隐藏；终态 15 秒后自动隐藏
            if (['done', 'scan_done', 'error', 'cancelled'].includes(status)) {
                clearTimeout(banner._hideTimer);
                banner._hideTimer = setTimeout(() => {
                    banner.style.display = 'none';
                }, 15000);
            }
        }

        function subscribeTask(taskId) {
            if (!stomp || !connected) return;
            if (taskSubscriptions[taskId]) return;
            const sub = stomp.subscribe(`/user/queue/task/${taskId}`, (msg) => {
                try {
                    const body = JSON.parse(msg.body);
                    log('recv', `任务 ${taskId}: ${JSON.stringify(body)}`);
                    if (body.event === 'task_progress' && body.data && body.data.page !== undefined) {
                        const url = getImageUrl(taskId, body.data.page);
                        addImage(taskId, body.data.page, url);
                        if (body.data.total_pages > 0) {
                            const pct = body.data.percent.toFixed(1);
                            log('info', `进度：${pct}% (${body.data.page}/${body.data.total_pages})`);
                            progressSpan.style.display = '';
                            progressSpan.innerText = `(${pct}%)`;
                        } else {
                            log('info', `已扫描第 ${body.data.page} 页`);
                            progressSpan.style.display = '';
                            progressSpan.innerText = `(第${body.data.page}页)`;
                        }
                    }
                    if (body.event === 'task_status' && body.data) {
                        const status = body.data.status || '';
                        const label = {
                            scanning: '扫描中...',
                            scan_done: '扫描完成',
                            done: '已完成',
                            error: '任务失败',
                            cancelled: '已取消'
                        };
                        showTaskBanner(status, label[status] || status);
                    }
                    if (body.event === 'task_error' && body.data) {
                        showTaskBanner('error', body.data.error || '未知错误');
                    }
                } catch (e) {
                    log('err', '解析失败');
                }
            });
            taskSubscriptions[taskId] = sub;
            log('info', `已订阅 /user/queue/task/${taskId}`);
        }

        function sendCommand(dest, payload, desc) {
            if (!stomp || !connected) {
                log('err', '未连接');
                return false;
            }
            log('send', `${dest} ${desc || ''}: ${JSON.stringify(payload)}`);
            stomp.publish({ destination: dest, body: JSON.stringify(payload) });
            return true;
        }

        function scannerStatusColor(status) {
            const colors = {
                ready: '#52c41a',
                busy: '#1677ff',
                scanning: '#1677ff',
                warming_up: '#faad14',
                paper_empty: '#fa8c16',
                paper_jam: '#ff4d4f',
                cover_open: '#ff4d4f',
                error: '#ff4d4f',
                disconnected: '#d9d9d9',
                connected: '#52c41a'
            };
            return colors[status] || '#d9d9d9';
        }

        function scannerStatusLabel(status) {
            const labels = {
                ready: '就绪',
                busy: '繁忙',
                scanning: '扫描中',
                warming_up: '预热中',
                paper_empty: '缺纸',
                paper_jam: '卡纸',
                cover_open: '盖板打开',
                error: '错误',
                disconnected: '离线',
                connected: '已连接'
            };
            return labels[status] || status;
        }

        /* 根据采集模式更新输出格式下拉选项 */
        function updateFormatOptions(mode) {
            acquireMode = mode;
            const sel = $('fFormat');
            const currentVal = sel.value;
            const isBuffered = mode === 'BUFFERED';
            sel.innerHTML = '';
            // BUFFERED 模式只支持 JPEG（PNG 仅作为 JPEG 转换失败的兜底，不列在选项中）
            const opts = isBuffered
                ? [{ v: 'jpeg', t: 'JPEG（BUFFERED）' }]
                : [{ v: 'jpeg', t: 'JPEG' }, { v: 'png', t: 'PNG' }, { v: 'pdf', t: 'PDF' }, { v: 'tiff', t: 'TIFF' }];
            opts.forEach(o => {
                const opt = document.createElement('option');
                opt.value = o.v;
                opt.textContent = o.t;
                if (o.v === currentVal && (isBuffered ? o.v === 'jpeg' : true)) opt.selected = true;
                sel.appendChild(opt);
            });
            const badge = document.getElementById('formatBadge');
            if (badge) badge.style.display = isBuffered ? '' : 'none';
        }

        function renderScanners(data) {
            const scanners = data?.data?.scanners || data?.scanners;
            if (!scanners || !scanners.length) {
                $('scannerDisplay').innerHTML = '<div style="color:#999;">未检测到扫描仪</div>';
                return;
            }
            $('scannerDisplay').innerHTML = scanners.map(s => `<div style="padding:6px 0; display:flex; gap:10px;"><span class="status-dot" style="background:${scannerStatusColor(s.status)}"></span><strong>${escapeHtml(s.alias || s.name)}</strong><span style="font-size:11px;color:#999;">${s.identifier}</span><span style="font-size:11px;color:${scannerStatusColor(s.status)};">${scannerStatusLabel(s.status)}</span></div>`).join('');
        }

        function populateScannerSelect(scanners) {
            const sel = $('fScanner');
            const currentVal = sel.value;
            sel.innerHTML = '<option value="">默认（自动选择）</option>';
            scanners.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.identifier;
                opt.textContent = `${s.identifier}(${scannerStatusLabel(s.status)})`;
                if (s.is_busy || s.status === 'busy' || s.status === 'scanning') {
                    opt.disabled = true;
                    opt.textContent += ' — 繁忙';
                }
                if (opt.value === currentVal) opt.selected = true;
                sel.appendChild(opt);
            });
        }

        // 连接逻辑
        function connect() {
            let host = $('serverUrl').value.trim();
            if (!host) host = 'localhost:8899';
            const token = $('token').value.trim();
            // token 作为 URL 查询参数传给 JwtHandshakeInterceptor（connectHeaders 是 STOMP 帧 header，握手拦截器读不到）
            const wsUrl = token ? `ws://${host}/ws?Authorization=Bearer ${encodeURIComponent(token)}` : `ws://${host}/ws`;
            stomp = new StompJs.Client({
                brokerURL: wsUrl,
                heartbeatIncoming: 20000,
                heartbeatOutgoing: 20000,
                debug: (str) => {
                    if (!str.includes('PING')) log('info', `[STOMP] ${str.substring(0, 120)}`);
                },
                onConnect: () => {
                    setConnectedState(true);
                    log('info', 'STOMP 连接成功');
                    stomp.subscribe('/user/queue/reply', (msg) => {
                        try {
                            const body = JSON.parse(msg.body);
                            log('recv', `服务端回复: ${JSON.stringify(body)}`);
                            if (body.data && Array.isArray(body.data.scanners)) {
                                renderScanners(body);
                                populateScannerSelect(body.data.scanners);
                            }
                            if (body.data && body.data.acquire_mode) {
                                updateFormatOptions(body.data.acquire_mode);
                            }
                            if (body.code !== 0 && body.msg) log('err', `命令失败: ${body.msg}`);
                        } catch (e) {
                        }
                    });
                    stomp.subscribe('/topic/scanner', () => {
                        sendCommand('/app/scanner/status', {}, '刷新扫描仪');
                    });
                    sendCommand('/app/scanner/status', {}, '获取扫描仪列表');
                },
                onStompError: (frame) => log('err', `STOMP错误: ${frame.headers?.message}`),
                onWebSocketClose: () => {
                    if (connected) log('warn', '连接断开');
                    setConnectedState(false);
                    // 不置 null：STOMP.js v7 内部自动重连，stomp 引用需保持有效
                    Object.keys(taskSubscriptions).forEach(k => delete taskSubscriptions[k]);
                }
            });
            stomp.activate();
            log('info', `连接 ${wsUrl}`);
        }

        function disconnect() {
            if (stomp) stomp.deactivate();
            setConnectedState(false);
            log('info', '已断开');
        }

        // 双面/双张开关UI
        const duplexCheck = document.getElementById('fDuplex');
        const duplexSwitch = document.getElementById('duplexSwitch');
        const duplexLabel = document.getElementById('duplexLabel');

        function updateDuplexUI() {
            const active = duplexCheck.checked;
            duplexSwitch.classList.toggle('active', active);
            duplexLabel.innerText = active ? '双面模式' : '单面模式';
        }

        duplexSwitch.addEventListener('click', () => {
            duplexCheck.checked = !duplexCheck.checked;
            updateDuplexUI();
        });
        const doubleFeedCheck = document.getElementById('fDoubleFeed');
        const doubleFeedSwitch = document.getElementById('doubleFeedSwitch');
        const doubleFeedLabel = document.getElementById('doubleFeedLabel');

        function updateDoubleFeedUI() {
            const active = doubleFeedCheck.checked;
            doubleFeedSwitch.classList.toggle('active', active);
            doubleFeedLabel.innerText = active ? '双张检测开' : '双张检测关';
        }

        doubleFeedSwitch.addEventListener('click', () => {
            doubleFeedCheck.checked = !doubleFeedCheck.checked;
            updateDoubleFeedUI();
        });
        updateDuplexUI();
        updateDoubleFeedUI();

        // 按钮绑定
        $('btnConnect').onclick = connect;
        $('btnDisconnect').onclick = disconnect;
        $('btnScannerStatus').onclick = () => sendCommand('/app/scanner/status', {}, '获取扫描仪');
        $('btnStartScan').onclick = () => {
            const taskId = $('fTaskId').value.trim();
            if (!taskId) {
                log('err', 'task_id必填');
                return;
            }
            const params = {
                task_id: taskId,
                scanner_name: $('fScanner').value.trim() || undefined,
                dpi: parseInt($('fDpi').value) || 200,
                color_mode: $('fColor').value,
                duplex: duplexCheck.checked,
                enable_double_feed_detection: doubleFeedCheck.checked,
                enable_deskew: $('fDeskew').checked,
                enable_border_detection: $('fBorder').checked,
                enable_auto_rotate: $('fRotate').checked,
                enable_blank_page_removal: $('fBlank').checked,
                output_format: $('fFormat').value
            };
            subscribeTask(taskId);
            sendCommand('/app/scan/start', params, '启动扫描');
        };
        $('btnTaskStatus').onclick = () => {
            const tid = $('fOpTaskId').value.trim();
            if (!tid) {
                log('err', '需输入task_id');
                return;
            }
            subscribeTask(tid);
            sendCommand('/app/scan/status', { task_id: tid });
        };
        $('btnTaskStop').onclick = () => {
            const tid = $('fOpTaskId').value.trim();
            if (!tid) {
                log('err', '需输入task_id');
                return;
            }
            sendCommand('/app/scan/stop', { task_id: tid });
        };
        $('btnTaskList').onclick = () => sendCommand('/app/scan/list', {});
        $('btnHealth').onclick = () => sendCommand('/app/scan/health', {});

        // ── 历史文件浏览（三层结构） ──
        const historyModal = $('historyModal');
        const historyContent = $('historyContent');
        const historyModalTitle = $('historyModalTitle');
        const historyBackBtn = $('historyBackBtn');
        const historyRefreshBtn = $('historyRefreshBtn');
        const historyStack = []; // 浏览栈：{ type: 'folders'|'tasks'|'files', dateDir, taskId }

        function getApiBase() {
            const host = $('serverUrl').value.trim() || 'localhost:8899';
            return `http://${host}`;
        }

        /** 加载日期文件夹列表（第一层） */
        async function loadHistoryFolders() {
            historyBackBtn.style.display = 'none';
            historyModalTitle.innerHTML = '📁 历史文件';
            historyContent.innerHTML = '<div style="color:#999; text-align:center; padding:40px 0;">加载中...</div>';
            try {
                const resp = await fetch(`${getApiBase()}/api/scan/history/folders`);
                const result = await resp.json();
                if (result.code !== 0) {
                    historyContent.innerHTML = `<div style="color:var(--error);text-align:center;padding:40px 0;">加载失败：${escapeHtml(result.msg)}</div>`;
                    return;
                }
                const folders = result.data || [];
                if (!folders.length) {
                    historyContent.innerHTML = '<div style="color:#999; text-align:center; padding:40px 0;">暂无历史文件</div>';
                    return;
                }
                let html = '';
                folders.forEach(f => {
                    const display = `${f.slice(0, 4)}-${f.slice(4, 6)}-${f.slice(6, 8)}`;
                    html += `<div class="history-folder-item" data-folder="${f}" style="display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:8px;border-radius:12px;border:1px solid var(--border);cursor:pointer;transition:all 0.15s;background:#fafbfc;" onmouseover="this.style.background='#e6f4ff';this.style.borderColor='#1677ff'" onmouseout="this.style.background='#fafbfc';this.style.borderColor='var(--border)'">
                    <span style="font-size:24px;">📁</span>
                    <div style="flex:1;">
                        <div style="font-weight:600;font-size:15px;">${display}</div>
                        <div style="font-size:12px;color:#999;">${f}</div>
                    </div>
                    <span style="color:#999;font-size:18px;">›</span>
                </div>`;
                });
                historyContent.innerHTML = html;
                historyContent.querySelectorAll('.history-folder-item').forEach(el => {
                    el.addEventListener('click', () => navigateToTasks(el.dataset.folder));
                });
            } catch (e) {
                historyContent.innerHTML = `<div style="color:var(--error);text-align:center;padding:40px 0;">网络错误：${escapeHtml(e.message)}</div>`;
            }
        }

        /** 加载任务目录列表（第二层） */
        async function loadTaskDirs(dateDir) {
            historyBackBtn.style.display = '';
            const display = `${dateDir.slice(0, 4)}-${dateDir.slice(4, 6)}-${dateDir.slice(6, 8)}`;
            historyModalTitle.innerHTML = `📁 ${display}`;
            historyContent.innerHTML = '<div style="color:#999; text-align:center; padding:40px 0;">加载中...</div>';
            try {
                const resp = await fetch(`${getApiBase()}/api/scan/history/folders/${dateDir}`);
                const result = await resp.json();
                if (result.code !== 0) {
                    historyContent.innerHTML = `<div style="color:var(--error);text-align:center;padding:40px 0;">加载失败：${escapeHtml(result.msg)}</div>`;
                    return;
                }
                const tasks = result.data || [];
                if (!tasks.length) {
                    historyContent.innerHTML = '<div style="color:#999; text-align:center; padding:40px 0;">该日期暂无任务</div>';
                    return;
                }
                let html = '';
                tasks.forEach(t => {
                    html += `<div class="history-task-item" data-dir="${dateDir}" data-task="${t}" style="display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:8px;border-radius:12px;border:1px solid var(--border);cursor:pointer;transition:all 0.15s;background:#fafbfc;" onmouseover="this.style.background='#f0f5ff';this.style.borderColor='#1677ff'" onmouseout="this.style.background='#fafbfc';this.style.borderColor='var(--border)'">
                    <span style="font-size:20px;">📂</span>
                    <div style="flex:1;">
                        <div style="font-weight:500;font-size:14px;">${escapeHtml(t)}</div>
                    </div>
                    <span style="color:#999;font-size:18px;">›</span>
                </div>`;
                });
                historyContent.innerHTML = html;
                historyContent.querySelectorAll('.history-task-item').forEach(el => {
                    el.addEventListener('click', () => navigateToFiles(el.dataset.dir, el.dataset.task));
                });
            } catch (e) {
                historyContent.innerHTML = `<div style="color:var(--error);text-align:center;padding:40px 0;">网络错误：${escapeHtml(e.message)}</div>`;
            }
        }

        /** 加载任务文件列表（第三层） */
        async function loadTaskFiles(dateDir, taskId) {
            historyBackBtn.style.display = '';
            const display = `${dateDir.slice(0, 4)}-${dateDir.slice(4, 6)}-${dateDir.slice(6, 8)}`;
            historyModalTitle.innerHTML = `📁 ${display} / ${escapeHtml(taskId)}`;
            historyContent.innerHTML = '<div style="color:#999; text-align:center; padding:40px 0;">加载中...</div>';
            try {
                const resp = await fetch(`${getApiBase()}/api/scan/history/folders/${dateDir}/${taskId}`);
                const result = await resp.json();
                if (result.code !== 0) {
                    historyContent.innerHTML = `<div style="color:var(--error);text-align:center;padding:40px 0;">加载失败：${escapeHtml(result.msg)}</div>`;
                    return;
                }
                const files = result.data || [];
                if (!files.length) {
                    historyContent.innerHTML = '<div style="color:#999; text-align:center; padding:40px 0;">该任务暂无文件</div>';
                    return;
                }
                let html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;">';
                files.forEach(f => {
                    const isPdf = f.file_name.toLowerCase().endsWith('.pdf');
                    const sizeStr = f.size > 1024 * 1024
                        ? (f.size / 1024 / 1024).toFixed(1) + ' MB'
                        : f.size > 1024 ? Math.round(f.size / 1024) + ' KB' : f.size + ' B';
                    const pageLabel = f.page ? `第 ${f.page} 页` : '';
                    html += `<div class="history-file-item" data-url="${escapeHtml(f.preview_url)}" data-name="${escapeHtml(f.file_name)}" style="background:#fafbfc;border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.borderColor='#1677ff';this.style.boxShadow='0 4px 12px rgba(22,119,255,0.12)'" onmouseout="this.style.borderColor='var(--border)';this.style.boxShadow='none'">
                    <div style="aspect-ratio:1/1.2;display:flex;align-items:center;justify-content:center;background:${isPdf ? '#fff7e6' : '#f5f7fa'};font-size:40px;">${isPdf ? '📄' : '🖼️'}</div>
                    <div style="padding:8px 10px;">
                        <div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(f.file_name)}">${escapeHtml(f.file_name)}</div>
                        <div style="display:flex;justify-content:space-between;font-size:11px;color:#999;margin-top:4px;">
                            <span>${pageLabel}</span>
                            <span>${sizeStr}</span>
                        </div>
                    </div>
                </div>`;
                });
                html += '</div>';
                historyContent.innerHTML = html;
                historyContent.querySelectorAll('.history-file-item').forEach(el => {
                    el.addEventListener('click', () => {
                        // 自动展开画廊
                        if (galleryCollapsed) galleryExpand();
                        // 将该任务下的所有文件批量添加到画廊
                        const clickName = el.dataset.name;
                        let clickIndex = -1;
                        files.forEach((f, fi) => {
                            const key = 'history_' + f.file_name;
                            if (document.querySelector(`.gallery-item[data-key="${key}"]`)) {
                                if (f.file_name === clickName) {
                                    clickIndex = galleryItems.findIndex(item => item.key === key);
                                }
                                return;
                            }
                            const placeholder = imageArea.querySelector('div:first-child');
                            if (placeholder && !placeholder.classList.contains('gallery-item')) {
                                placeholder.remove();
                            }
                            galleryItems.push({ key, taskId: 'history', page: f.file_name, imgUrl: f.preview_url });
                            const gi = galleryItems.length - 1;
                            if (f.file_name === clickName) clickIndex = gi;
                            const div = document.createElement('div');
                            div.className = 'gallery-item';
                            div.setAttribute('data-key', key);
                            div.innerHTML = `<div class="page-badge">📁 ${escapeHtml(f.file_name)}</div><img src="${f.preview_url}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%22%20height%3D%22100%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23f0f0f0%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%20dy%3D%22.3em%22%20fill%3D%22%23999%22%3E加载失败%3C%2Ftext%3E%3C%2Fsvg%3E';">`;
                            div.addEventListener('click', () => openLightbox(gi));
                            imageArea.appendChild(div);
                        });
                        const total = document.querySelectorAll('.gallery-item').length;
                        pageCountSpan.innerText = `${total} 张`;
                        if (clickIndex >= 0) openLightbox(clickIndex);
                        historyModal.classList.remove('active');
                    });
                });
            } catch (e) {
                historyContent.innerHTML = `<div style="color:var(--error);text-align:center;padding:40px 0;">网络错误：${escapeHtml(e.message)}</div>`;
            }
        }

        // ── 导航管理（栈操作与加载分离） ──
        function navigateToFolders() {
            historyStack.length = 0;
            historyStack.push({ type: 'folders' });
            loadHistoryFolders();
        }

        function navigateToTasks(dateDir) {
            historyStack.push({ type: 'tasks', dateDir });
            loadTaskDirs(dateDir);
        }

        function navigateToFiles(dateDir, taskId) {
            historyStack.push({ type: 'files', dateDir, taskId });
            loadTaskFiles(dateDir, taskId);
        }

        function historyGoBack() {
            if (historyStack.length <= 1) return;
            historyStack.pop();
            const prev = historyStack[historyStack.length - 1];
            if (prev.type === 'folders') loadHistoryFolders();
            else if (prev.type === 'tasks') loadTaskDirs(prev.dateDir);
            else if (prev.type === 'files') loadTaskFiles(prev.dateDir, prev.taskId);
        }

        // 打开历史模态框
        $('btnHistory').onclick = () => {
            historyModal.classList.add('active');
            navigateToFolders();
        };

        // 关闭历史模态框
        $('historyModalClose').onclick = () => historyModal.classList.remove('active');
        historyModal.addEventListener('click', (e) => {
            if (e.target === historyModal) historyModal.classList.remove('active');
        });

        // 返回上级
        historyBackBtn.onclick = historyGoBack;

        // 刷新当前视图
        historyRefreshBtn.onclick = () => {
            const current = historyStack[historyStack.length - 1];
            if (current.type === 'folders') loadHistoryFolders();
            else if (current.type === 'tasks') loadTaskDirs(current.dateDir);
            else if (current.type === 'files') loadTaskFiles(current.dateDir, current.taskId);
        };

        log('info', '客户端已准备就绪，支持日志折叠/图片预览/历史文件浏览');

        // Tauri 桌面端自动连接
        if (window.__TAURI__) {
            log('info', '检测到 Tauri 桌面环境，自动连接后端服务...');
            function tryAutoConnect() {
                const host = $('serverUrl').value.trim() || 'localhost:8899';
                fetch(`http://${host}/api/scan/health`)
                    .then(r => { if (r.ok) connect(); else setTimeout(tryAutoConnect, 1000); })
                    .catch(() => setTimeout(tryAutoConnect, 1000));
            }
            tryAutoConnect();
        }
    </script>
</body>

</html>
